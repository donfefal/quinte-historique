name: Mise à jour des données

# Chaque jour : collecte les derniers résultats + la course Quinté+ du jour, régénère les JSON et les publie.
# Lancement manuel possible : onglet « Actions » → « Mise à jour des données » → « Run workflow ».
on:
  schedule:
    - cron: "30 6 * * *"    # 06h30 UTC (= heure du Burkina) : programme du jour
    - cron: "30 11 * * *"   # 11h30 UTC : cotes publiées, avant les premières courses
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: maj-donnees
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # Base SQLite conservée d'une exécution à l'autre : seules les nouvelles journées sont téléchargées.
      # La toute première exécution télécharge 24 mois d'historique (environ 40 à 60 minutes).
      - name: Restaurer la base de collecte
        uses: actions/cache@v4
        with:
          path: collecte/quinte.sqlite
          key: quinte-db-${{ github.run_id }}
          restore-keys: quinte-db-

      - name: Collecter et générer les JSON (dossier temporaire)
        run: python scripts/collecte_quinte.py --output data_new

      - name: Publier seulement si les données sont valides et ont changé
        run: python scripts/publier_si_change.py data_new data

      - name: Commit et push
        id: push
        run: |
          git config user.name "maj-donnees[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "Rien à publier."
            echo "publie=non" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Mise à jour automatique des données ($(date -u +%F\ %H:%M) UTC)"
            git push
            echo "publie=oui" >> "$GITHUB_OUTPUT"
          fi

      # Un push fait avec le jeton du workflow ne déclenche pas toujours la reconstruction de GitHub Pages : on la demande.
      - name: Reconstruire GitHub Pages
        if: steps.push.outputs.publie == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Reconstruction Pages non demandée (non bloquant)."
